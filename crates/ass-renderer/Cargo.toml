[package]
name = "ass-renderer"
version = "0.1.0"
edition = "2021"
authors = ["ass-rs contributors"]
description = "High-performance ASS subtitle renderer with modular backends"
license = "MPL-2.0"
repository = "https://github.com/ass-rs/ass-renderer"
keywords = ["ass", "subtitle", "renderer", "webgpu", "vulkan"]
categories = ["multimedia::video", "graphics", "rendering"]

[dependencies]
# Core dependency
ass-core = { path = "../ass-core", version = "0.1.0" }

# Text shaping and rendering
rustybuzz = "0.11"
tiny-skia = "0.11"
fontdb = "0.16"
ttf-parser = "0.20"

# Parallelization
rayon = { version = "1.10", optional = true }

# Repose GPU backend (scene emission + offscreen readback)
repose-core = { path = "../../../repose/crates/repose-core", optional = true }
repose-render-wgpu = { path = "../../../repose/crates/repose-render-wgpu", optional = true }
lyon_path = { version = "1.0", optional = true }
lyon_tessellation = { version = "1.0", optional = true }

# Utilities
smallvec = "1.14"
thiserror = "1.0"
ahash = "0.8"
bumpalo = { version = "3.16", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

# Debug and visualization
image = { version = "0.24", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"
pretty_assertions = "1.4"
env_logger = "0.11"

[features]
default = ["analysis-integration", "software-backend", "backend-probing", "simd", "image", "serde"]

# Main feature sets
minimal = ["nostd", "analysis-integration"]
full = ["analysis-integration", "software-backend", "backend-probing", "simd", "image", "serde"]

# Core features
analysis-integration = ["ass-core/analysis"]
software-backend = ["rayon"]
repose-backend = ["dep:repose-core", "dep:repose-render-wgpu", "dep:lyon_path", "dep:lyon_tessellation"]
backend-probing = []
backend-metrics = []

# Performance features
simd = ["ass-core/simd", "tiny-skia/simd"]
arena = ["bumpalo", "ass-core/arena"]

# Serialization
serde = ["dep:serde", "dep:serde_json", "ass-core/serde"]

# Debug features
image = ["dep:image"]

# No-std support (software backend only; the Repose backend needs std + GPU)
nostd = ["ass-core/nostd"]

# Dev-only: link native libass (vcpkg on Windows / pkg-config elsewhere) to A/B
# compare the software backend against libass. Requires libass to be installed;
# excluded from default/full so normal builds never need the native library.
libass-compare = []

# Unicode wrapping support
unicode-wrap = ["ass-core/unicode-wrap"]

# Development features
benches = []
docs = ["full", "repose-backend", "unicode-wrap", "plugins", "benches"] # Safe feature set for documentation

# Plugin system support
plugins = []

# libass discovery for the dev-only `libass-compare` feature (see build.rs).
[target.'cfg(windows)'.build-dependencies]
vcpkg = "0.2"

[target.'cfg(not(windows))'.build-dependencies]
pkg-config = "0.3"

[[bench]]
name = "render_benchmarks"
harness = false
required-features = ["benches"]

[[example]]
name = "libass_compare"
required-features = ["software-backend", "image", "analysis-integration"]

[[example]]
name = "libass_ffi_compare"
required-features = ["software-backend", "image", "analysis-integration", "libass-compare"]

[[example]]
name = "libass_bench"
required-features = ["software-backend", "analysis-integration", "libass-compare"]
